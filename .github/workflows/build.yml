name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Download iOS 17.0 SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          curl -L -o iPhoneOS17.0.sdk.tar.xz https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS17.0.sdk.tar.xz
          tar -xf iPhoneOS17.0.sdk.tar.xz

      - name: Build
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
