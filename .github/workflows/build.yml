name: Build Tweak
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: theos/theos-action@main
        with:
          sdk: 17.0
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
