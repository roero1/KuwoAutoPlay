name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make curl wget unzip liblzma-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # 下载 Linux 交叉编译工具链！！这行是之前缺失的关键
          $THEOS/bin/install-toolchain linux

      - name: Install SDK
        run: |
          $THEOS/bin/install-sdk latest

      - name: Build deb package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
