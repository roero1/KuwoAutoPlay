name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
          sudo apt update
          sudo apt install -y libbz2-dev liblzma-dev

      - name: Download iPhoneOS17.0 SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          wget -q "https://github.com/SDKs-iOS/iPhoneOS17.0.sdk/raw/main/iPhoneOS17.0.sdk.tar.xz"
          tar -Jxf iPhoneOS17.0.sdk.tar.xz

      - name: Build package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
