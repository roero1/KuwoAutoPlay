name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git make curl wget unzip liblzma-dev

      - name: Download Theos (mirror + retry)
        run: |
          for i in {1..3}; do
            git clone --recursive https://mirror.ghproxy.com/https://github.com/theos/theos.git "$THEOS" && break
            echo "Clone failed, retry $i/3"
            rm -rf "$THEOS"
            sleep 8
          done

      - name: Run official online installer (install toolchain + SDK)
        run: |
          bash -c "$(curl -fsSL https://mirror.ghproxy.com/https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build deb
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export THEOS_MAKE_PATH="${THEOS}/makefiles"
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
