name: Build Tweak
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make curl wget unzip liblzma-dev

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Fetch Theos SDK repo
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/* sdks/
          rm -rf master.zip sdks-master

      - name: Build package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
